<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Procházka domem 182j47</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.0.16/index.css">
<style>
:root{--ink:#111;--mute:#737373;--line:#E2E2DF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#ECECEA;overflow:hidden;font:400 15px/1.45 "Inter Variable",Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ui{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
.ui button{pointer-events:auto;font:inherit;font-size:14px;color:var(--ink);background:rgba(255,255,255,.94);border:0;min-height:38px;padding:0 14px;cursor:pointer}
.ui button.on{background:var(--ink);color:#fff}
.ui .q{margin-left:auto;background:rgba(255,255,255,.7);font-size:13px;color:#4A4A4A}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:28px 30px;max-width:min(420px,calc(100% - 32px))}
.hint h1{font-weight:300;font-size:28px;letter-spacing:-.03em;margin-bottom:10px}
.hint p{margin-bottom:18px;color:#4A4A4A}
.hint button{font:500 15px/1 inherit;font-family:inherit;color:#fff;background:var(--ink);border:0;min-height:46px;padding:0 24px;cursor:pointer}
.load{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--mute)}
.load i{display:block;width:180px;height:1px;background:var(--line);position:relative;overflow:hidden}
.load i b{position:absolute;left:0;top:0;bottom:0;background:var(--ink);width:0;transition:width .2s}
.cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none;display:none}
.pad{position:absolute;left:24px;bottom:76px;width:110px;height:110px;border-radius:50%;border:1px solid rgba(0,0,0,.25);background:rgba(255,255,255,.35);display:none;pointer-events:none}
.pad i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(17,17,17,.55)}
@media (hover:none){.pad{display:block}}
</style>
</head>
<body>
<div class="load" id="load"><span id="ltxt">Načítám model domu…</span><i><b id="lbar"></b></i></div>
<div class="cross" id="cross"></div>
<div class="pad" id="pad"><i></i></div>
<div class="hint" id="hint" hidden>
  <h1>Procházka domem</h1>
  <p id="htxt">Klikněte do obrazu. Myší se rozhlížíte, klávesami W A S D nebo šipkami chodíte. Esc vás pustí ven.</p>
  <button id="go">Začít</button>
</div>
<div class="ui" id="ui"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
RectAreaLightUniformsLib.init();

const EYE=1.6, R=0.3, SPEED=1.5;
// F124: starts come from <model>_walk.json (_tools/walk_spots.py: solved from the walkable free space of the model,
// all in one connected area, never behind a sofa); coordinates of the drawing (x, y; Blender) -> three (x, z = -y)
let SPOTS=[['Obývací pokoj',[10.77,-10.5],[15.5,-9.6]]], HIDE=['interior_doors','door_handles'];
const touch=matchMedia('(hover:none)').matches;
const Q=new URLSearchParams(location.search);
// F128 (Martin: "procházení má být víc fotorealistické, moderní počítače to utáhnou"): sky and light from the same HDRI
// as the renders, sun with soft shadows, ambient occlusion in corners (GTAO), AgX tone curve; on a slow machine the
// heavy parts switch off by themselves (frame time), ?q=0 forces the light version
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,touch?1.5:1.75));renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.NeutralToneMapping;renderer.toneMappingExposure=1.0;renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#e3e3e3');
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,600);cam.rotation.order='YXZ';
// sun from the garden side (south-west), the same direction family as the daytime renders
const HC=new THREE.Vector3(14,0,10);
const sun=new THREE.DirectionalLight(0xfff3e2,2.6);sun.position.copy(HC).add(new THREE.Vector3(-22,30,26));sun.target.position.copy(HC);
sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);const sc_=sun.shadow.camera;sc_.left=-26;sc_.right=26;sc_.top=26;sc_.bottom=-26;sc_.near=1;sc_.far=120;
sun.shadow.bias=-0.0002;sun.shadow.normalBias=0.025;sun.shadow.radius=3;
scene.add(sun,sun.target);
const hemi=new THREE.HemisphereLight(0xffffff,0xb9ad98,0.25);scene.add(hemi);

const composer=new EffectComposer(renderer,new THREE.WebGLRenderTarget(innerWidth,innerHeight,{samples:4,type:THREE.HalfFloatType}));
composer.addPass(new RenderPass(scene,cam));
const ao=new GTAOPass(scene,cam,innerWidth,innerHeight);ao.updateGtaoMaterial({radius:0.45,distanceExponent:1.6,thickness:1.2,scale:1.0,samples:16});
ao.blendIntensity=0.9;composer.addPass(ao);
composer.addPass(new OutputPass());
let HQ=Q.get('q')!=='0';ao.enabled=HQ;
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});

const solid=[];let yaw=0,pitch=0;
const draco=new DRACOLoader();draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/libs/draco/gltf/');
const mgr=new THREE.LoadingManager();mgr.onProgress=(u,a,b)=>{document.getElementById('lbar').style.width=(100*a/b)+'%'};
const gl=new GLTFLoader(mgr);gl.setDRACOLoader(draco);
const src=Q.get('m')||'3d/182j47.glb';
const base=src.replace(/\.glb$/,'');
const cfg=fetch(base+'_walk.json').then(r=>r.ok?r.json():null).catch(()=>null);
const load=u=>new Promise((ok,no)=>gl.load(u,ok,undefined,no));
const sky=new Promise(ok=>new RGBELoader(mgr).load(base+'_sky.hdr',t=>ok(t),undefined,()=>ok(null)));

function prep(root,collide){root.traverse(o=>{if(!o.isMesh)return;
  const n=(o.name+' '+(o.parent?o.parent.name:'')).toLowerCase();
  // door leaves are open in the walk (the model has them closed), flames and haze are for renders only
  if(/flame|glow|haze|cloud/.test(n)||HIDE.some(k=>n.includes(k))){o.visible=false;return}
  const glass=/glass|glazing/.test(n);
  // clear glass: the view out matters more than the milky reflection of the sky
  if(glass){o.material=new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:0.03,metalness:0,transparent:true,opacity:0.07,envMapIntensity:0.5,depthWrite:false});o.castShadow=false;o.receiveShadow=false}else{o.castShadow=true;o.receiveShadow=true}
  if(/led/.test(n)||!collide)return;
  solid.push(o)})}

Promise.all([load(src),cfg,sky,load(base+'_okoli.glb').catch(()=>null)]).then(([g,c,hdr,env])=>{
  if(c&&c.spots&&c.spots.length){SPOTS=c.spots;HIDE=c.hide||HIDE}
  // daylight through the windows: a soft area light in every opening, facing into the room (portals, as in the renders)
  for(const [x,y,z0,z1,nx,ny,w] of ((c&&c.portals)||[]).slice(0,14)){const L=new THREE.RectAreaLight(0xeef2f7,3.2,w,z1-z0);
    L.position.set(x,(z0+z1)/2,-y);L.lookAt(x+nx,(z0+z1)/2,-(y+ny));scene.add(L)}
  if(hdr){hdr.mapping=THREE.EquirectangularReflectionMapping;scene.background=hdr;scene.environment=hdr;
    scene.backgroundRotation.y=scene.environmentRotation.y=THREE.MathUtils.degToRad((c&&c.sky_rot)||200)}
  prep(g.scene,true);scene.add(g.scene);
  if(env){prep(env.scene,true);scene.add(env.scene)}
  document.getElementById('load').remove();buttons();
  go(0);document.getElementById('hint').hidden=false;
  if(touch)document.getElementById('htxt').textContent='Tažením po obraze se rozhlížíte, kruhem vlevo dole chodíte. Tlačítky dole přeskočíte do jiné místnosti.';
}).catch(e=>{console.error(e);document.getElementById('ltxt').textContent='Model se nepodařilo načíst.'});

if(Q.has('debug'))window.__walk={cam,scene,renderer,look:(y,p)=>{yaw=y;pitch=p},go:i=>go(i),q:v=>{HQ=v;setQ()}};
const ui=document.getElementById('ui');
function buttons(){ui.innerHTML='';SPOTS.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[0];b.onclick=()=>go(i);ui.append(b)});
  const q=document.createElement('button');q.className='q';q.onclick=()=>{HQ=!HQ;setQ()};ui.append(q);setQ()}
function setQ(){ao.enabled=HQ;renderer.shadowMap.enabled=HQ;sun.castShadow=HQ;scene.traverse(o=>{if(o.material)o.material.needsUpdate=true});
  const q=ui.querySelector('.q');if(q)q.textContent=HQ?'Vyšší kvalita: zap':'Vyšší kvalita: vyp'}
function go(i){const [,p,t]=SPOTS[i];cam.position.set(p[0],EYE,-p[1]);yaw=Math.atan2(-(t[0]-p[0]),-(-t[1]+p[1]));pitch=-0.05;
  [...ui.children].forEach((b,k)=>b.classList.toggle('on',k===i));snap()}

const ray=new THREE.Raycaster();const down=new THREE.Vector3(0,-1,0),up=new THREE.Vector3(0,1,0);
// floor under the eye: from 1.7 m down, below door heads (F124)
function snap(){ray.set(new THREE.Vector3(cam.position.x,cam.position.y-EYE+1.7,cam.position.z),down);ray.far=3;
  const h=ray.intersectObjects(solid,false)[0];if(h)cam.position.y=h.point.y+EYE}
function blocked(dir,dist){for(const y of [0.45,1.1]){ray.set(new THREE.Vector3(cam.position.x,cam.position.y-EYE+y,cam.position.z),dir);ray.far=dist+R;
  if(ray.intersectObjects(solid,false).length)return true}
  // F124: no floor within half a metre below the next step = the walk ends there
  const q=cam.position.clone().addScaledVector(dir,dist+R);ray.set(new THREE.Vector3(q.x,cam.position.y-EYE+1.7,q.z),down);ray.far=2.2;
  return !ray.intersectObjects(solid,false).length}
// indoors the sky lights the room through the windows only: less sky light under a ceiling (smoothly)
let inside=1;function indoor(){ray.set(cam.position,up);ray.far=6;return ray.intersectObjects(solid,false).length?1:0}

const keys={};addEventListener('keydown',e=>{keys[e.code]=true});addEventListener('keyup',e=>{keys[e.code]=false});
const cv=renderer.domElement;
document.getElementById('go').onclick=()=>{document.getElementById('hint').hidden=true;if(!touch)cv.requestPointerLock()};
cv.addEventListener('click',()=>{if(!touch&&document.pointerLockElement!==cv){document.getElementById('hint').hidden=true;cv.requestPointerLock()}});
document.addEventListener('pointerlockchange',()=>{document.getElementById('cross').style.display=document.pointerLockElement===cv?'block':'none'});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==cv)return;yaw-=e.movementX*0.0022;pitch=Math.max(-1.3,Math.min(1.3,pitch-e.movementY*0.0022))});
// dotyk: levá dolní část = chůze (virtuální páka), jinde rozhlížení tažením
let look=null,move=null,mv={x:0,y:0};const pad=document.getElementById('pad'),knob=pad.firstElementChild;
cv.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'&&e.pointerType!=='pen'){return}document.getElementById('hint').hidden=true;
  const r=pad.getBoundingClientRect();if(e.clientX<r.right+40&&e.clientY>r.top-40){move={id:e.pointerId,cx:r.left+r.width/2,cy:r.top+r.height/2}}else look={id:e.pointerId,x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',e=>{if(look&&e.pointerId===look.id){yaw+=(e.clientX-look.x)*0.004;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-look.y)*0.004));look.x=e.clientX;look.y=e.clientY}
  if(move&&e.pointerId===move.id){let dx=e.clientX-move.cx,dy=e.clientY-move.cy;const l=Math.hypot(dx,dy),m=40;if(l>m){dx*=m/l;dy*=m/l}mv={x:dx/m,y:dy/m};knob.style.transform=`translate(${dx}px,${dy}px)`}});
const end=e=>{if(look&&e.pointerId===look.id)look=null;if(move&&e.pointerId===move.id){move=null;mv={x:0,y:0};knob.style.transform=''}};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

const clock=new THREE.Clock();let ft=0,fn=0,fk=0;
renderer.setAnimationLoop(()=>{const dt=Math.min(0.05,clock.getDelta());
  // automatic quality: after the first 90 frames, a slow machine (> 45 ms a frame) drops AO and shadows
  if(HQ&&fk<1&&solid.length){ft+=dt;fn++;if(fn===90){fk=1;if(ft/fn>0.045&&Q.get('q')!=='1'){HQ=false;setQ()}}}
  let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-mv.y,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+mv.x;
  if(!touch){if(keys.ArrowLeft)yaw+=1.6*dt;if(keys.ArrowRight)yaw-=1.6*dt}
  cam.rotation.set(pitch,yaw,0);
  if(f||s){const fw=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),rt=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    const d=fw.multiplyScalar(f).add(rt.multiplyScalar(s));const l=Math.min(1,d.length());d.normalize();const step=SPEED*l*dt*(keys.ShiftLeft?2:1);
    if(!blocked(d,step)){cam.position.addScaledVector(d,step);snap()}
    else{for(const ax of [new THREE.Vector3(Math.sign(d.x),0,0),new THREE.Vector3(0,0,Math.sign(d.z))]){if(ax.lengthSq()&&!blocked(ax,step*Math.abs(ax.x?d.x:d.z))){cam.position.addScaledVector(ax,step*Math.abs(ax.x?d.x:d.z));snap();break}}}}
  if(solid.length){inside+=(indoor()-inside)*Math.min(1,dt*3);
    scene.environmentIntensity=1.0-0.45*inside;renderer.toneMappingExposure=1.0+0.35*inside;hemi.intensity=0.25-0.1*inside}
  composer.render()});
</script>
</body>
</html>
